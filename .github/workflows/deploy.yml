# Workflow name displayed in the GitHub Actions tab
name: Deploy static content to Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push events to the 'main' branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
      
      # Set up Node.js environment
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Use a specific, supported Node.js version
          cache: 'npm' # Cache npm dependencies

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the Vite project
      - name: Build project
        run: npm run build

      # Configure GitHub Pages environment variables
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the build artifact (the 'dist' folder)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The output directory from your build (default for Vite)
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Runs only after the 'build' job completes successfully
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
